name: Flutter CD & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Judul Rilis (Contoh: Rilis Versi 1.0.0)'
        required: false
        default: 'Pembaruan Rilis Aplikasi HoaxCheck'
      release_notes:
        description: 'Catatan Rilis / Changelog Singkat'
        required: false
        default: 'Peningkatan performa, optimasi caching, dan perbaikan bug.'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build Release APK & App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Supabase Config
        run: cp lib/core/config/supabase_config.example.dart lib/core/config/supabase_config.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Verification
        run: flutter test

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Split-per-ABI Release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GOOGLE_FACT_CHECK_API_KEY="${{ secrets.GOOGLE_FACT_CHECK_API_KEY }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=ML_API_URL="${{ secrets.ML_API_URL }}"

      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle \
            --dart-define=GOOGLE_FACT_CHECK_API_KEY="${{ secrets.GOOGLE_FACT_CHECK_API_KEY }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=ML_API_URL="${{ secrets.ML_API_URL }}"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoaxcheck-release-builds
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release (Saat Tag v* Dibuat)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          body: ${{ github.event.inputs.release_notes || 'Rilis otomatis aplikasi HoaxCheck dari pipeline CI/CD GitHub Actions.' }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
