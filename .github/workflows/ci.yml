name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test --coverage

  build_preview_apk:
    name: Build & Verify Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split-per-ABI APKs
        run: |
          flutter build apk --split-per-abi \
            --dart-define=GOOGLE_FACT_CHECK_API_KEY="${{ secrets.GOOGLE_FACT_CHECK_API_KEY }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=ML_API_URL="${{ secrets.ML_API_URL }}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoaxcheck-preview-apks
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 7
